name: tambola_caller
description: "Tambola Caller — a large-format, fully offline number caller for Tambola/Housie."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  # Housie ticket printing: vector PDF generation plus the Android print and
  # share sheets.
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icon. The two source images live in assets/icon/ and are only read
# at build time, which is why they are not listed as runtime assets above.
# After changing either image, or anything in this block, regenerate with:
#
#   flutter pub get
#   dart run flutter_launcher_icons
#
# That writes the density buckets under android/app/src/main/res/mipmap-*/ and
# rewrites the adaptive icon in mipmap-anydpi-v26/, so the generated files are
# committed rather than the placeholder vectors they replace.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#241B47"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android shows only the central 72 of the 108dp adaptive canvas, and a
  # circular mask is the tightest of them. At 25% the wordmark clears every
  # mask; at the 16% default a circle clipped the ends of TAMBOLA and CALLER.
  adaptive_icon_foreground_inset: 25
  min_sdk_android: 24
